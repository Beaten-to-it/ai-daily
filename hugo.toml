baseURL = "https://beaten-to-it.github.io/ai-daily/"
languageCode = "ko"
defaultContentLanguage = "ko"
title = "AI Daily"
theme = "PaperMod"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  mainSections = ["news", "posts", "usecase"]

[menu]
  [[menu.main]]
    name = "News"
    url = "news/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "posts/"
    weight = 2
  [[menu.main]]
    name = "AI UseCase"
    url = "usecase/"
    weight = 3
  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 4
