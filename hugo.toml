baseURL = "https://beaten-to-it.github.io/ai-daily/"
languageCode = "ko"
defaultContentLanguage = "ko"
title = "AI Daily"
theme = "PaperMod"
# KST 아침 발행물이 UTC 기준 미래로 누락되지 않게 한다.
buildFuture = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  mainSections = ["daily"]

[menu]
  [[menu.main]]
    name = "Daily"
    url = "daily/"
    weight = 1
  [[menu.main]]
    name = "Articles"
    url = "articles/"
    weight = 2
  [[menu.main]]
    name = "Executive"
    url = "executive/"
    weight = 3
  [[menu.main]]
    name = "Guides"
    url = "guides/"
    weight = 4
  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 5
